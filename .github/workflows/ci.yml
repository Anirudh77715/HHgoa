# This replaces local Docker entirely.
#
# The only real benefit of a local Docker install is catching Dockerfile
# breakage fast. GitHub Actions does that on every push, free for public
# repos, with no WSL2 and no reboots — and it verifies the build on clean
# Linux rather than on one developer's machine, which is strictly better
# evidence that the HF Spaces build will succeed.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  corpus:
    name: corpus builds and passes invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Assert the invariants against the COMMITTED corpus first. This is the
      # check that must never be allowed to fail: it is deterministic, needs no
      # network, and it guards the failures that would otherwise surface as
      # confidently wrong answers at demo time.
      - name: assert corpus invariants (committed corpus)
        run: python -m app.corpus.verify

      # Re-scrape the live site as a DRIFT CHECK, and deliberately do not let
      # it fail the build. hhgoa.com is a third party: it can be down, or block
      # GitHub's IP ranges, and neither is a defect in this repo. Letting that
      # turn the build red trains everyone to ignore a red build, which costs
      # more than the drift signal is worth.
      - name: re-scrape live site (drift check, non-blocking)
        id: rescrape
        continue-on-error: true
        run: |
          python -m app.corpus.scrape
          python -m app.corpus.verify
          git diff --stat -- data/corpus/ || true

      - name: report drift
        if: steps.rescrape.outcome == 'failure'
        run: |
          echo "::warning::Live re-scrape or its invariants failed. Either hhgoa.com" \
               "is unreachable from CI, or the site changed in a way the extractors" \
               "do not handle. The committed corpus still passes, so the build is" \
               "green -- but check this before relying on the corpus being current."

  guardrails:
    name: guardrail acceptance suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # No GEMINI_API_KEY here, deliberately. check_groundedness is a pure
      # function of (answer, contexts) and the retrieval path runs entirely
      # locally, so the guardrail the whole design leans on is testable with
      # no secrets and no quota. This is the payoff for keeping the guardrails
      # deterministic instead of using an LLM judge.
      - name: build chunks and index
        run: |
          python -m app.chunking.build
          python -m app.index.build --model "BAAI/bge-small-en"

      # Exits non-zero only on UNDOCUMENTED failures. The known blind spots in
      # bench/guardrail_cases.yaml are expected and do not fail the run; a new
      # one does.
      - name: guardrail acceptance cases
        run: python -m bench.bench_guardrails --verbose

  image:
    name: docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only — we never push. This is a compile check for the Dockerfile
      # so a broken build is caught here instead of in an HF Spaces rebuild
      # queue minutes before a deadline.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: hh-goa-voice-rag:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: container serves /healthz
        run: |
          docker run -d --name rag -p 7860:7860 hh-goa-voice-rag:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:7860/healthz; then echo "healthy"; exit 0; fi
            sleep 2
          done
          echo "--- container did not become healthy; logs: ---"
          docker logs rag
          exit 1
