- id: q047
  query: what is the wifi password
  category: adversarial_near_miss
  expect: refuse
  gold: []
  note: |
    Hardest case in the set. faq-02 mentions WiFi, so retrieval WILL return a
    high-scoring chunk — but the password is not in it. A similarity threshold
    alone cannot catch this; only the groundedness check can. If the system
    invents a password, that is the failure mode this whole eval exists to
    detect.

