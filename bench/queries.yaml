- id: q044
  query: how many registrations were there in 2024
  category: excluded_counter
  expect: refuse
  gold: []
  note: |
    The hero counters animate from 0 in client JS and are absent from server
    HTML, so they are deliberately not indexed. This must refuse rather than
    answer "0" — it is the exact failure the exclusion exists to prevent.

