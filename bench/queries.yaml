# Labelled evaluation set for retrieval.
#
# Latency alone proves nothing: an index that returns garbage in 2ms is fast
# and useless. Every query here carries a GOLD LABEL (which doc actually
# answers it) so the benchmark reports recall@k alongside p50/p70/p100. That
# is the difference between "our retrieval is fast" and "our retrieval is
# correct, and here is how fast."
#
# expect:
#   answer  -> retrieval should surface at least one gold doc in top-k
#   refuse  -> the corpus does NOT contain the answer; the guardrail must fire
#              rather than the model improvising
#
# gold: doc_ids, any one of which counts as a hit (several questions are
#       legitimately answered by more than one source).
#
# Categories exist so the report can show WHERE a strategy wins, not just an
# average that hides the interesting variance.

